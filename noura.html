<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOURA - Offline Utility</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0A0B10; color: #ffffff; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1A1C23; padding: 25px; border-radius: 16px; border: 1px solid #00E5FF; box-shadow: 0px 4px 15px rgba(0, 229, 255, 0.2); }
        h1 { color: #00E5FF; text-align: center; font-size: 24px; letter-spacing: 2px; }
        .tagline { color: #B388FF; text-align: center; font-size: 10px; margin-top: -15px; margin-bottom: 20px; letter-spacing: 1px;}
        label { display: block; margin-top: 15px; font-weight: bold; color: #00E5FF; font-size: 14px;}
        textarea { width: 100%; height: 70px; margin-top: 5px; background: #0A0B10; border: 1px solid #B388FF; color: #fff; padding: 10px; border-radius: 8px; box-sizing: border-box; font-family: inherit;}
        select { width: 100%; padding: 8px; margin-bottom: 15px; background: #0A0B10; color: #fff; border: 1px solid #00E5FF; border-radius: 6px; }
        .btn-save { width: 100%; padding: 14px; margin-top: 20px; background: linear-gradient(90deg, #0052D4, #00C9FF); color: #fff; border: none; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; }
        .btn-sync { width: 100%; padding: 10px; margin-top: 10px; background: transparent; color: #B388FF; border: 1px solid #B388FF; font-weight: bold; border-radius: 8px; cursor: pointer; display: none;}
        #statusMessage { margin-top: 15px; text-align: center; font-size: 13px; font-weight: bold; min-height: 20px;}
        .offline-text { color: #FFC107; }
        .online-text { color: #00E676; }
    </style>
</head>
<body>

<div class="container">
    <h1>NOURA</h1>
    <div class="tagline">EDGE AI UTILITY</div>

    <!-- Detección de idioma simulada -->
    <select id="langSelector" onchange="changeLanguage()">
        <option value="es">🇪🇸 Español</option>
        <option value="en">🇺🇸 English</option>
        <option value="fr">🇫🇷 Français</option>
    </select>

    <div id="formSection">
        <label id="lblGood">¿Qué fue lo que más te gustó? (BIEN)</label>
        <textarea id="txtGood" placeholder="Escribe aquí..."></textarea>

        <label id="lblBad">¿Qué mejorarías? (MAL)</label>
        <textarea id="txtBad" placeholder="Escribe aquí..."></textarea>

        <button class="btn-save" id="btnSubmit" onclick="saveDataOffline()">Guardar Reseña</button>
    </div>

    <div id="statusMessage"></div>
    <button class="btn-sync" id="btnSync" onclick="syncData()">Simular Conexión (Sincronizar a NOURA)</button>
</div>

<script>
    // 1. Diccionario Ultra-Ligero (Menos de 1KB)
    const dict = {
        es: { good: "¿Qué fue lo que más te gustó? (BIEN)", bad: "¿Qué mejorarías? (MAL)", btn: "Guardar Reseña", saved: "Guardado localmente. Sin conexión a internet 📡", synced: "¡Datos enviados a la operadora! ✅" },
        en: { good: "What did you like the most? (GOOD)", bad: "What would you improve? (BAD)", btn: "Save Feedback", saved: "Saved locally. No internet connection 📡", synced: "Data forwarded to operator! ✅" },
        fr: { good: "Qu'avez-vous le plus aimé ? (BIEN)", bad: "Que devrions-nous améliorer ? (MAL)", btn: "Enregistrer", saved: "Enregistré localement. Pas de connexion 📡", synced: "Données envoyées à l'opérateur ! ✅" }
    };

    let currentLang = "es";

    function changeLanguage() {
        currentLang = document.getElementById("langSelector").value;
        document.getElementById("lblGood").innerText = dict[currentLang].good;
        document.getElementById("lblBad").innerText = dict[currentLang].bad;
        document.getElementById("btnSubmit").innerText = dict[currentLang].btn;
    }

    // 2. Lógica Store-and-Forward (Almacenamiento Local)
    function saveDataOffline() {
        const goodText = document.getElementById("txtGood").value;
        const badText = document.getElementById("txtBad").value;

        if(!goodText && !badText) return alert("Escribe algo antes de guardar.");

        const feedback = { lang: currentLang, good: goodText, bad: badText, timestamp: new Date().toISOString() };
        
        // Guardamos en la memoria del navegador (Simula el caché del teléfono)
        localStorage.setItem("noura_pending_feedback", JSON.stringify(feedback));

        // Actualizamos UI
        document.getElementById("txtGood").value = "";
        document.getElementById("txtBad").value = "";
        const status = document.getElementById("statusMessage");
        status.innerText = dict[currentLang].saved;
        status.className = "offline-text";
        
        // Mostramos el botón para simular que regresó el internet
        document.getElementById("btnSync").style.display = "block";
    }

    // 3. Simulación del Forward (Cuando detecta Wi-Fi)
    function syncData() {
        const pendingData = localStorage.getItem("noura_pending_feedback");
        if(pendingData) {
            console.log("Enviando paquete a Small AI de la operadora:", JSON.parse(pendingData));
            localStorage.removeItem("noura_pending_feedback");
            
            const status = document.getElementById("statusMessage");
            status.innerText = dict[currentLang].synced;
            status.className = "online-text";
            document.getElementById("btnSync").style.display = "none";
        }
    }
</script>

</body>
</html>
